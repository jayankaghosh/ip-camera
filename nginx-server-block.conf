# Complete Nginx Server Block Configuration
# Save this to: /etc/nginx/sites-available/ipcamera

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ipcam.jayanka.in;
    return 301 https://$server_name$request_uri;
}

# Main HTTPS server
server {
    server_name ipcam.jayanka.in;

    # Set project root variable
    set $PROJECT_ROOT /var/www/html/ipcamera;

    # Include FurCam configuration
    include /var/www/html/ipcamera/nginx.conf;

    # Max upload size
    client_max_body_size 100M;

    # SSL Configuration (managed by Certbot)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
}
