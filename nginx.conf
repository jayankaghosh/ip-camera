# FurCam — location rules, included inside the HTTPS server block
# (see nginx-server-block.conf). Expects $PROJECT_ROOT to be set by the includer.
#
# The app runs as: TRUST_PROXY=1 PORT=8908 npm start
# (TRUST_PROXY makes it listen on 127.0.0.1 only and read the client IP from X-Real-IP.)

# WebRTC signaling WebSocket. Connections stay open for the whole broadcast,
# so the timeouts are long; the browser reconnects if one does drop.
location /ws {
    proxy_pass http://127.0.0.1:8908;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";   # nginx's Basic auth stays at nginx; the app never sees it
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}

# Hashed build assets: serve straight from disk and cache forever.
location ~ ^/_next/static/(.*)$ {
    alias $PROJECT_ROOT/.next/static/$1;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Everything else goes to Next.js.
location / {
    proxy_pass http://127.0.0.1:8908;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";   # nginx's Basic auth stays at nginx; the app never sees it
}

# Camera and microphone are needed by /host; nothing else is.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
